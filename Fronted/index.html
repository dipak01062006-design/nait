<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: linear-gradient(to right, #4facfe, #00f2fe);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            width:350px;
            padding:25px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
        }

        .profile-img{
            width:120px;
            height:120px;
            border-radius:50%;
            border:4px solid #4facfe;
            margin-bottom:15px;
        }

        h1{
            color:#333;
            margin-bottom:10px;
        }

        p{
            color:#555;
            margin-bottom:10px;
            line-height:1.5;
        }

        .btn{
            display:inline-block;
            margin-top:15px;
            padding:10px 20px;
            background:#4facfe;
            color:white;
            text-decoration:none;
            border-radius:25px;
            transition:0.3s;
        }

        .btn:hover{
            background:#0077ff;
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="https://via.placeholder.com/120"
             alt="Profile Picture"
             class="profile-img">

        <h1>Dipak Kumar</h1>

        <p>
            Hello! My name is Dipak Kumar.
            I am a student and I love coding,
            web development, and learning new technologies.
        </p>

        <p>
            My hobbies are reading, gaming,
            and exploring computer programming.
        </p>

        <a href="#" class="btn">Contact Me</a>

    </div>

</body>
</html>
